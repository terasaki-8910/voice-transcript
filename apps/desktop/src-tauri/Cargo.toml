[package]
name = "voice-transcript-desktop"
version = "0.5.2"
description = "Voice Transcript desktop app -- Rust shell + React webview, sharing @voice-transcript/core via a Node sidecar"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voice_transcript_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
trash = "5.2.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-clipboard-manager = "2.3.2"
cpal = "0.17.1"
hound = "3.5.1"
# Held below the releases that require tauri ^2.12 so adding the updater
# doesn't also upgrade the tauri runtime (wry/tao) underneath; lift these
# together with `tauri` and @tauri-apps/api.
tauri-plugin-updater = "~2.12.0"
tauri-plugin-process = "~2.3.1"
